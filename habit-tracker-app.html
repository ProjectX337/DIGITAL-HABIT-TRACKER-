&lt;body&gt;
&lt;div id=&quot;habit-tracker&quot; aria-label=&quot;Habit tracking app&quot;&gt;

    }
  &lt;/style&gt;

  &lt;section class=&quot;day-picker&quot; aria-label=&quot;Monthly consistency report&quot;&gt;
    &lt;div class=&quot;viz-grid&quot; aria-label=&quot;Current month summary&quot;&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;Completed&lt;/div&gt;&lt;div class=&quot;viz-stat-value&quot; id=&quot;completed-total&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;text-muted&quot;&gt;all habits this month&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;Check-ins&lt;/div&gt;&lt;div class=&quot;viz-stat-value&quot; id=&quot;checked-total&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;text-muted&quot; id=&quot;checked-caption&quot;&gt;of 0 possible&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;Consistency&lt;/div&gt;&lt;div class=&quot;viz-stat-value&quot; id=&quot;consistency-total&quot;&gt;0%&lt;/div&gt;&lt;div class=&quot;text-muted&quot;&gt;completed check-ins&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;day-detail&quot; class=&quot;card hidden&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div&gt;&lt;h2 id=&quot;selected-date&quot;&gt;Selected day&lt;/h2&gt;&lt;div class=&quot;text-muted&quot;&gt;Choose an area, then record its status.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;habit-actions&quot; aria-label=&quot;Habit status controls&quot;&gt;
        &lt;section class=&quot;habit-action&quot; aria-label=&quot;Gratitude status&quot;&gt;&lt;h3&gt;Gratitude&lt;/h3&gt;&lt;div class=&quot;checkin-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-area=&quot;gratitude&quot; data-status=&quot;complete&quot; aria-pressed=&quot;false&quot; aria-label=&quot;Mark gratitude complete&quot;&gt;✓&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-area=&quot;gratitude&quot; data-status=&quot;incomplete&quot; aria-pressed=&quot;false&quot; aria-label=&quot;Mark gratitude incomplete&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;habit-action&quot; aria-label=&quot;Journaling status&quot;&gt;&lt;h3&gt;Journaling&lt;/h3&gt;&lt;div class=&quot;checkin-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-area=&quot;journaling&quot; data-status=&quot;complete&quot; aria-pressed=&quot;false&quot; aria-label=&quot;Mark journaling complete&quot;&gt;✓&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-area=&quot;journaling&quot; data-status=&quot;incomplete&quot; aria-pressed=&quot;false&quot; aria-label=&quot;Mark journaling incomplete&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;section class=&quot;habit-action&quot; aria-label=&quot;Meditation status&quot;&gt;&lt;h3&gt;Meditation&lt;/h3&gt;&lt;div class=&quot;checkin-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-area=&quot;meditation&quot; data-status=&quot;complete&quot; aria-pressed=&quot;false&quot; aria-label=&quot;Mark meditation complete&quot;&gt;✓&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-area=&quot;meditation&quot; data-status=&quot;incomplete&quot; aria-pressed=&quot;false&quot; aria-label=&quot;Mark meditation incomplete&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;month-bar&quot;&gt;
      &lt;div&gt;&lt;h2 id=&quot;month-title&quot;&gt;Monthly report&lt;/h2&gt;&lt;div class=&quot;text-muted&quot;&gt;Select a day to log gratitude, journaling, or meditation.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;viz-row&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;previous-month&quot;&gt;Previous&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;next-month&quot;&gt;Next&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div id=&quot;month-report&quot; class=&quot;report-grid&quot; role=&quot;grid&quot; aria-label=&quot;Monthly habit checklist&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;report-footer text-small&quot; aria-label=&quot;Calendar legend&quot;&gt;&lt;span&gt;✓ Completed habits&lt;/span&gt;&lt;span&gt;○ Incomplete habits&lt;/span&gt;&lt;span&gt;— No check-in&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;score-header&quot;&gt;
      &lt;div&gt;&lt;h2&gt;Consistency score report&lt;/h2&gt;&lt;div class=&quot;text-muted&quot; id=&quot;score-caption&quot;&gt;Monthly check-in flow&lt;/div&gt;&lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;download-report&quot;&gt;Download CSV&lt;/button&gt;
    &lt;/div&gt;
    &lt;table class=&quot;score-table&quot; aria-describedby=&quot;score-caption&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Day&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Gratitude&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Journaling&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Meditation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody id=&quot;score-rows&quot;&gt;&lt;/tbody&gt;
    &lt;/table&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;habit-tracker&#x27;);
      const areas = { gratitude: &#x27;Gratitude&#x27;, journaling: &#x27;Journaling&#x27;, meditation: &#x27;Meditation&#x27; };
      const storeKey = &#x27;habit-tracker-records&#x27;;
      let records;
      try { records = JSON.parse(localStorage.getItem(storeKey)) || {}; } catch { records = {}; }
      Object.keys(areas).forEach(area =&gt; { records[area] = records[area] || {}; });
      let selectedDate = null;
      let viewDate = new Date();
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
      const report = root.querySelector(&#x27;#month-report&#x27;);
      const detail = root.querySelector(&#x27;#day-detail&#x27;);
      const scoreRows = root.querySelector(&#x27;#score-rows&#x27;);
      const selectedDateLabel = root.querySelector(&#x27;#selected-date&#x27;);
      const fmtMonth = new Intl.DateTimeFormat(undefined, { month: &#x27;long&#x27;, year: &#x27;numeric&#x27; });
      const fmtDate = new Intl.DateTimeFormat(undefined, { weekday: &#x27;long&#x27;, month: &#x27;long&#x27;, day: &#x27;numeric&#x27;, year: &#x27;numeric&#x27; });
      const keyFor = date =&gt; `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, &#x27;0&#x27;)}-${String(date.getDate()).padStart(2, &#x27;0&#x27;)}`;
      const save = () =&gt; { try { localStorage.setItem(storeKey, JSON.stringify(records)); } catch { /* Keep tracking in memory when storage is unavailable. */ } };
      const today = new Date();

      function daySummary(date) {
        const values = Object.keys(areas).map(area =&gt; records[area][keyFor(date)]).filter(Boolean);
        const done = values.filter(value =&gt; value === &#x27;complete&#x27;).length;
        const missed = values.filter(value =&gt; value === &#x27;incomplete&#x27;).length;
        return values.length ? `${done}✓ ${missed}○` : &#x27;— No check-in&#x27;;
      }

      function updateDetail() {
        if (!selectedDate) { detail.classList.add(&#x27;hidden&#x27;); return; }
        detail.classList.remove(&#x27;hidden&#x27;);
        selectedDateLabel.textContent = fmtDate.format(selectedDate);
        root.querySelectorAll(&#x27;[data-area][data-status]&#x27;).forEach(button =&gt; {
          const value = records[button.dataset.area][keyFor(selectedDate)];
          button.setAttribute(&#x27;aria-pressed&#x27;, String(value === button.dataset.status));
        });
      }

      function renderReport() {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const count = new Date(year, month + 1, 0).getDate();
        const first = new Date(year, month, 1).getDay();
        const available = year === today.getFullYear() &amp;&amp; month === today.getMonth() ? today.getDate() : (viewDate &lt; new Date(today.getFullYear(), today.getMonth(), 1) ? count : 0);
        const allValues = [];
        for (let day = 1; day &lt;= available; day++) Object.keys(areas).forEach(area =&gt; allValues.push(records[area][keyFor(new Date(year, month, day))]));
        const checked = allValues.filter(Boolean).length;
        const completed = allValues.filter(value =&gt; value === &#x27;complete&#x27;).length;
        root.querySelector(&#x27;#completed-total&#x27;).textContent = completed;
        root.querySelector(&#x27;#checked-total&#x27;).textContent = checked;
        root.querySelector(&#x27;#checked-caption&#x27;).textContent = `of ${available * 3} possible`;
        root.querySelector(&#x27;#consistency-total&#x27;).textContent = checked ? `${Math.round((completed / checked) * 100)}%` : &#x27;0%&#x27;;
        root.querySelector(&#x27;#month-title&#x27;).textContent = fmtMonth.format(viewDate);
        const cells = [&#x27;Sun&#x27;, &#x27;Mon&#x27;, &#x27;Tue&#x27;, &#x27;Wed&#x27;, &#x27;Thu&#x27;, &#x27;Fri&#x27;, &#x27;Sat&#x27;].map(name =&gt; `&lt;div class=&quot;weekday&quot; role=&quot;columnheader&quot;&gt;${name}&lt;/div&gt;`);
        for (let i = 0; i &lt; first; i++) cells.push(&#x27;&lt;div class=&quot;day empty&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&#x27;);
        for (let day = 1; day &lt;= count; day++) {
          const date = new Date(year, month, day);
          const chosen = selectedDate &amp;&amp; keyFor(date) === keyFor(selectedDate);
          const todayClass = keyFor(date) === keyFor(today) ? &#x27; today&#x27; : &#x27;&#x27;;
          cells.push(`&lt;button class=&quot;day${todayClass}${chosen ? &#x27; is-selected&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot; role=&quot;gridcell&quot; data-date=&quot;${keyFor(date)}&quot; aria-label=&quot;${fmtDate.format(date)}. ${daySummary(date)}&quot;&gt;&lt;span class=&quot;day-number&quot;&gt;${day}&lt;/span&gt;&lt;span class=&quot;day-status&quot;&gt;${daySummary(date)}&lt;/span&gt;&lt;/button&gt;`);
        }
        report.innerHTML = cells.join(&#x27;&#x27;);
        root.querySelector(&#x27;#score-caption&#x27;).textContent = `${fmtMonth.format(viewDate)} check-in flow`;
        const rows = [];
        for (let day = 1; day &lt;= count; day++) {
          const date = new Date(year, month, day);
          const formatStatus = area =&gt; {
            const status = records[area][keyFor(date)];
            if (status === &#x27;complete&#x27;) return &#x27;&lt;span class=&quot;score-mark&quot; aria-label=&quot;Complete&quot;&gt;✓&lt;/span&gt;&#x27;;
            if (status === &#x27;incomplete&#x27;) return &#x27;&lt;span class=&quot;score-mark&quot; aria-label=&quot;Incomplete&quot;&gt;✕&lt;/span&gt;&#x27;;
            return &#x27;&lt;span class=&quot;score-mark none&quot; aria-label=&quot;No check-in&quot;&gt;—&lt;/span&gt;&#x27;;
          };
          rows.push(`&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${day}&lt;/th&gt;&lt;td&gt;${formatStatus(&#x27;gratitude&#x27;)}&lt;/td&gt;&lt;td&gt;${formatStatus(&#x27;journaling&#x27;)}&lt;/td&gt;&lt;td&gt;${formatStatus(&#x27;meditation&#x27;)}&lt;/td&gt;&lt;/tr&gt;`);
        }
        scoreRows.innerHTML = rows.join(&#x27;&#x27;);
      }

      function render() { updateDetail(); renderReport(); }
      root.querySelectorAll(&#x27;[data-area][data-status]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!selectedDate) return;
        records[button.dataset.area][keyFor(selectedDate)] = button.dataset.status;
        save();
        render();
      }));
      report.addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;[data-date]&#x27;);
        if (!button) return;
        const [year, month, day] = button.dataset.date.split(&#x27;-&#x27;).map(Number);
        selectedDate = new Date(year, month - 1, day);
        render();
      });
      root.querySelector(&#x27;#previous-month&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); selectedDate = null; render(); });
      root.querySelector(&#x27;#next-month&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); selectedDate = null; render(); });
      root.querySelector(&#x27;#download-report&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const count = new Date(year, month + 1, 0).getDate();
        const csv = [&#x27;Date,Gratitude,Journaling,Meditation&#x27;];
        for (let day = 1; day &lt;= count; day++) {
          const date = new Date(year, month, day);
          const values = Object.keys(areas).map(area =&gt; records[area][keyFor(date)] === &#x27;complete&#x27; ? &#x27;Complete&#x27; : records[area][keyFor(date)] === &#x27;incomplete&#x27; ? &#x27;Incomplete&#x27; : &#x27;No check-in&#x27;);
          csv.push(`${keyFor(date)},${values.join(&#x27;,&#x27;)}`);
        }
        const file = new Blob([csv.join(String.fromCharCode(10))], { type: &#x27;text/csv;charset=utf-8&#x27; });
        const link = document.createElement(&#x27;a&#x27;);
        link.href = URL.createObjectURL(file);
        link.download = `habit-consistency-${keyFor(viewDate).slice(0, 7)}.csv`;
        link.click();
        setTimeout(() =&gt; URL.revokeObjectURL(link.href), 0);
      });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);

  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,

            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
